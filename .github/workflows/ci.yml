name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        # Everything, examples included: they are the first code a contributor
        # reads, and lint that never runs on them is lint that rots.
        run: ruff check .

      - name: Type check (mypy)
        run: mypy agentleak/

      - name: Test (pytest + coverage gate)
        run: pytest --cov=agentleak --cov-report=term-missing --cov-fail-under=85

      - name: Smoke test the CLI
        run: |
          agentleak version
          agentleak run --scenario healthcare_patient_summary --output /tmp/reports --format json || true
          test -f /tmp/reports/run_healthcare_001.json

  # Dogfood our own Action: if the privacy gate ever stops working, our CI is
  # the first to know. `continue-on-error` because the demo scenario leaks on
  # purpose — we assert the gate *caught* it rather than that the repo passes.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Privacy gate must catch a leaking scenario
        id: leak
        continue-on-error: true
        env:
          AL_SCENARIO: healthcare_patient_summary
          AL_FAIL_UNDER: "80"
        run: python scripts/gh_gate.py

      - name: Privacy gate must pass a clean scenario
        env:
          AL_SCENARIO: healthcare_clean_referral
          AL_FAIL_UNDER: "80"
        run: python scripts/gh_gate.py

      - name: Assert the gate blocked the leaking run
        run: |
          if [ "${{ steps.leak.outcome }}" != "failure" ]; then
            echo "::error::The privacy gate did NOT block a leaking run."
            exit 1
          fi
          echo "Gate correctly blocked the leaking run."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agentleak/web/frontend/package-lock.json

      - name: Install & build (type-checks via tsc, then Vite build)
        working-directory: agentleak/web/frontend
        run: |
          npm ci
          npm run build
