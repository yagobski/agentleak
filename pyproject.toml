[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentleak"
version = "0.11.8"
description = "Privacy-leakage testing for AI agents: audit the whole execution trace, score it deterministically, gate it in CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AgentLeak contributors" },
]
keywords = ["ai", "agents", "privacy", "pii", "security", "llm", "leakage", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.9",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "jinja2>=3.0",
]

[project.optional-dependencies]
gui = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]
mcp = [
  # Coding agents reach for MCP tools, not a CLI. Kept an extra because the
  # core stays dependency-light: nobody analyzing a trace should pay for a
  # server SDK they will never start.
  "mcp>=1.0",
]
llm = [
  # No extra dependencies — uses stdlib urllib. Requires API key at runtime.
  # Kept as a named extra to signal intent and allow future optional LLM libs.
]
presidio = [
  "presidio-analyzer>=2.2",
  "spacy>=3.7",
]
guardrails = [
  # Optional guardrail backend wrappers (LLM Guard, NeMo, Lakera, etc.)
  # Install individually based on which backend you use.
]
full = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "presidio-analyzer>=2.2",
  "spacy>=3.7",
  "mcp>=1.0",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "mypy>=1.8",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.urls]
Homepage = "https://www.agentleak.org"
Documentation = "https://www.agentleak.org/docs"
Repository = "https://github.com/yagobski/agentleak"
Issues = "https://github.com/yagobski/agentleak/issues"
Changelog = "https://github.com/yagobski/agentleak/blob/main/CHANGELOG.md"
"Research paper" = "https://arxiv.org/abs/2602.11510"

[project.scripts]
agentleak = "agentleak.cli:main"

[tool.hatch.build]
# Never ship the frontend toolchain or its deps.
exclude = ["**/node_modules", "agentleak/web/frontend/**"]

[tool.hatch.build.targets.wheel]
packages = ["agentleak"]
# Built static assets aren't tracked by .gitignore's logic, so force-include them.
artifacts = [
  "agentleak/skill/SKILL.md",
  "agentleak/reporters/templates/*.j2",
  "agentleak/examples/*.json",
  "agentleak/scenarios/packs/*.json",
  "agentleak/web/static/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
  ".reuse",
  ".zenodo.json",
  "agentleak",
  "docs",
  "LICENSES",
  "scripts",
  "tests",
  "CHANGELOG.md",
  "CITATION.cff",
  "LICENSE",
  "README.md",
]
exclude = ["**/node_modules", "agentleak/web/frontend/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The demos run from a clone as well as from an install, so they put the repo
# root on sys.path before importing agentleak. That shim has to execute before
# the imports it enables, which is exactly what E402 forbids.
"examples/healthcare_compliance_demo/*.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.Body", "fastapi.Query", "fastapi.Depends", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
