<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0e0c"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.86" r="0.62">
      <stop offset="0" stop-color="#ff8257" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ff8257" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="#ff8257"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- wordmark -->
  <g transform="translate(72,86)">
    <rect x="0" y="-14" width="18" height="18" rx="4" fill="#ff8257"/>
    <text x="30" y="2" fill="#f5f4f0" font-size="21" font-weight="600" letter-spacing="-0.2">AgentLeak</text>
  </g>

  <!-- headline -->
  <text x="72" y="212" fill="#f5f4f0" font-size="60" font-weight="600" letter-spacing="-1.6">The final answer looks clean.</text>
  <text x="72" y="284" fill="#ff8257" font-size="60" font-weight="600" letter-spacing="-1.6">The tool call is not.</text>

  <text x="72" y="342" fill="#9d9c96" font-size="23" letter-spacing="-0.1">Privacy testing for AI agents across every internal channel.</text>

  <!-- the trace: this is the product thesis in six lines -->
  <g transform="translate(72,394)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
    <rect x="-1" y="-1" width="828" height="150" rx="10" fill="#11110f" stroke="#232320"/>

    <text x="22" y="34" fill="#6d6c66">final_output</text>
    <text x="212" y="34" fill="#9d9c96">"Follow-up scheduled."</text>
    <text x="770" y="34" fill="#4ea36b" text-anchor="end">clean</text>

    <text x="22" y="76" fill="#6d6c66">tool_call</text>
    <text x="212" y="76" fill="#f5f4f0">sin: 123-456-789</text>
    <text x="770" y="76" fill="#ff8257" text-anchor="end">L4</text>

    <text x="22" y="118" fill="#6d6c66">shared_memory</text>
    <text x="212" y="118" fill="#f5f4f0">diagnosis: type-2 diabetes</text>
    <text x="770" y="118" fill="#ff8257" text-anchor="end">L4</text>
  </g>

  <!-- proof strip -->
  <g transform="translate(950,394)">
    <rect x="-1" y="-1" width="180" height="150" rx="10" fill="#11110f" stroke="#232320"/>
    <text x="90" y="52" fill="#f5f4f0" font-size="44" font-weight="600" text-anchor="middle">283</text>
    <text x="90" y="78" fill="#9d9c96" font-size="15" text-anchor="middle">scenarios</text>
    <text x="90" y="116" fill="#9d9c96" font-size="14" text-anchor="middle">3 leak modes</text>
  </g>

  <text x="72" y="588" fill="#6d6c66" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">agentleak.org</text>
</svg>
