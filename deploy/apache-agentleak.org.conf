# AgentLeak Cloud — Apache vhost for agentleak.org.
#
# Use this when the server already runs Apache for other sites.
# The Docker app listens only on 127.0.0.1:8787; Apache terminates TLS and
# proxies public traffic to that loopback port.
#
# Install:
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#   sudo cp deploy/apache-agentleak.org.conf /etc/apache2/sites-available/zzz-agentleak.conf
#   sudo a2ensite zzz-agentleak
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d agentleak.org --redirect
#
# The zzz- prefix is intentional: on shared Apache hosts it keeps this vhost
# from becoming the default server ahead of existing sites.

<VirtualHost *:80>
    ServerName agentleak.org
    ServerAdmin admin@fomox.com

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300

    DocumentRoot /var/www/html
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/agentleak-error.log
    CustomLog ${APACHE_LOG_DIR}/agentleak-access.log combined
</VirtualHost>
