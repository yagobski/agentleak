# AgentLeak Cloud — nginx vhost for agents.fomox.com
#
# Use this when the server ALREADY runs nginx for other sites (e.g. ournia.com).
# It adds agents.fomox.com as a new server block that proxies to the AgentLeak
# container on 127.0.0.1:8787 — no conflict with existing sites.
#
# Install:
#   sudo cp deploy/nginx-agents.fomox.com.conf /etc/nginx/sites-available/agents.fomox.com
#   sudo ln -s /etc/nginx/sites-available/agents.fomox.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d agents.fomox.com     # provision TLS (edits this file)
#
# certbot will inject the ssl_certificate lines and the 80→443 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name agents.fomox.com;

    # certbot manages the TLS block. Until then this serves plain HTTP so the
    # ACME http-01 challenge can complete.

    client_max_body_size 12m;   # code-scan zip uploads

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # live agent runs / code scans can be slow
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8787/readyz;
        access_log off;
    }
}
