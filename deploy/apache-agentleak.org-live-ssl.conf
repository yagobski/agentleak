<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName agentleak.org
    Redirect permanent / https://www.agentleak.org/

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/agentleak.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/agentleak.org/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/agentleak-error.log
    CustomLog ${APACHE_LOG_DIR}/agentleak-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName www.agentleak.org
    ServerAdmin admin@fomox.com

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300
    ProxyPass / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/
    RequestHeader set X-Forwarded-Proto "https"

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/agentleak.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/agentleak.org/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/agentleak-error.log
    CustomLog ${APACHE_LOG_DIR}/agentleak-access.log combined
</VirtualHost>
</IfModule>
