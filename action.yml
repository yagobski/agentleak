name: "AgentLeak privacy gate"
description: "Fail a build when an agent leaks personal data or secrets through tool calls, memory, or logs."
author: "AgentLeak"

branding:
  icon: shield
  color: orange

inputs:
  trace:
    description: "Trace JSON file to analyze (a run captured from your agent)."
    required: false
    default: ""
  scenario:
    description: "Built-in scenario to run instead of a trace (or 'all')."
    required: false
    default: ""
  pack:
    description: "Take --scenario from a bundled pack, e.g. agentleak_bench."
    required: false
    default: ""
  scan:
    description: "Path to statically scan (file, directory or zip) instead of analyzing a trace."
    required: false
    default: ""
  fail-under:
    description: "Fail when the privacy score is below this value (0-100)."
    required: false
    default: "80"
  config:
    description: "Path to agentleak.yaml (detectors, policy, thresholds)."
    required: false
    default: ""
  version:
    description: "AgentLeak version specifier to install, e.g. '0.9.0' or 'latest'."
    required: false
    default: "latest"
  python-version:
    description: "Python version used to run the gate."
    required: false
    default: "3.11"
  annotate:
    description: "Emit GitHub annotations on the failing lines / channels."
    required: false
    default: "true"
  comment-summary:
    description: "Write the report to the workflow job summary."
    required: false
    default: "true"
  working-directory:
    description: "Directory to run in."
    required: false
    default: "."
  sarif:
    description: "Write findings as SARIF 2.1.0 to this path (off when empty). Upload it with github/codeql-action/upload-sarif; that job needs `security-events: write`."
    required: false
    default: ""
  pr-comment:
    description: "Post or update one sticky pull-request comment with the verdict and per-channel table (needs `pull-requests: write`)."
    required: false
    default: "false"
  baseline:
    description: "A JSON report (or a directory of them) from the base branch; the PR comment then lists new and resolved findings."
    required: false
    default: ""
  github-token:
    description: "Token used only to post the PR comment."
    required: false
    default: ${{ github.token }}

outputs:
  score:
    description: "Privacy score out of 100 (or the code score for a scan)."
    value: ${{ steps.gate.outputs.score }}
  risk-index:
    description: "AgentRisk index from 0 to 1 (empty for a code scan)."
    value: ${{ steps.gate.outputs.risk-index }}
  verdict:
    description: "Pass | Conditional pass | High risk | Fail."
    value: ${{ steps.gate.outputs.verdict }}
  findings:
    description: "Number of findings reported."
    value: ${{ steps.gate.outputs.findings }}
  report:
    description: "Path to the JSON report produced by the gate."
    value: ${{ steps.gate.outputs.report }}
  sarif:
    description: "Path to the SARIF file, when the sarif input is set."
    value: ${{ steps.gate.outputs.sarif }}
  comment:
    description: "created | updated | failed | skipped:<why>, when pr-comment is true."
    value: ${{ steps.gate.outputs.comment }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install AgentLeak
      shell: bash
      # Through env, not ${{ }} in the script: an expression is pasted into the
      # shell source before it runs, so a crafted version string would execute.
      env:
        AL_VERSION: ${{ inputs.version }}
      run: |
        if [ "$AL_VERSION" = "latest" ]; then
          pip install --quiet --upgrade agentleak
        else
          pip install --quiet "agentleak==$AL_VERSION"
        fi
        agentleak version

    - name: Run the privacy gate
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        AL_TRACE: ${{ inputs.trace }}
        AL_SCENARIO: ${{ inputs.scenario }}
        AL_PACK: ${{ inputs.pack }}
        AL_SCAN: ${{ inputs.scan }}
        AL_FAIL_UNDER: ${{ inputs.fail-under }}
        AL_CONFIG: ${{ inputs.config }}
        AL_ANNOTATE: ${{ inputs.annotate }}
        AL_SUMMARY: ${{ inputs.comment-summary }}
        AL_SARIF: ${{ inputs.sarif }}
        AL_PR_COMMENT: ${{ inputs.pr-comment }}
        AL_BASELINE: ${{ inputs.baseline }}
        AL_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python "$GITHUB_ACTION_PATH/scripts/gh_gate.py"
